<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Set by the pre-paint script below and kept in step by applyResolvedTheme. -->
    <meta name="theme-color" content="#f7f8fa" />

    <title>Runway — Know when your cash runs out</title>
    <meta
      name="description"
      content="Runway is a private, browser-local cash-flow and runway forecaster for freelancers, students and small businesses. Model recurring income, invoice delays and what-if scenarios in your browser."
    />
    <link rel="canonical" href="https://runway.danelrahmani.com/" />

    <!-- Link previews. Crawlers do not run JavaScript, so these must stay in the served HTML.
         The image is public/og.png, rendered from scripts/og-image.html. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Runway" />
    <meta property="og:title" content="Runway · Know when your cash runs out" />
    <meta
      property="og:description"
      content="A browser-local cash-flow forecaster for freelancers and small businesses, with day-by-day balance projections."
    />
    <meta property="og:url" content="https://runway.danelrahmani.com/" />
    <meta property="og:image" content="https://runway.danelrahmani.com/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Runway: Know when your cash runs out. A balance line falling to the day the cash runs out."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Runway · Know when your cash runs out" />
    <meta
      name="twitter:description"
      content="A browser-local cash-flow forecaster for freelancers and small businesses, with day-by-day balance projections."
    />
    <meta name="twitter:image" content="https://runway.danelrahmani.com/og.png" />
    <meta name="twitter:image:alt" content="Runway: Know when your cash runs out." />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <script>
      // Apply the stored theme before first paint to avoid a flash of the wrong theme.
      (function () {
        var dark = false;
        try {
          var stored = localStorage.getItem("runway.theme");
          // Anything other than an explicit choice follows the operating system.
          dark =
            stored === "dark" ||
            (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        } catch (_) {
          /* localStorage unavailable - fall back to the light theme */
        }
        if (dark) document.documentElement.classList.add("dark");
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#07080b" : "#f7f8fa");
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="min-h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
