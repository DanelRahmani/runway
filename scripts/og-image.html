<!doctype html>
<!--
  Source for public/og.png (the 1200×630 link-preview image).
  To regenerate: open this file in a browser at a 1200×630 viewport and
  screenshot the viewport as PNG, then save it over public/og.png.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "Geist Variable";
        src: url("../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2")
          format("woff2-variations");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Geist Mono Variable";
        src: url("../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2")
          format("woff2-variations");
        font-weight: 100 900;
      }
      :root {
        --bg: #07080b;
        --fg: #f4f6f9;
        --muted: #98a1b0;
        --accent: #ff4d6d;
      }
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: "Geist Variable", sans-serif;
        -webkit-font-smoothing: antialiased;
        position: relative;
      }
      .dots {
        position: absolute; inset: 0;
        background-image: radial-gradient(color-mix(in srgb, var(--fg) 14%, transparent) 1.5px, transparent 1.5px);
        background-size: 28px 28px;
        mask-image: radial-gradient(70% 80% at 20% 0%, black, transparent);
      }
      .glow {
        position: absolute; top: -220px; left: -120px; width: 820px; height: 520px;
        background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 28%, transparent), transparent);
        filter: blur(10px);
      }
      .chart { position: absolute; right: 0; bottom: 0; }
      .content {
        position: absolute; inset: 72px 80px; display: flex; flex-direction: column;
      }
      .brand { display: flex; align-items: center; gap: 18px; }
      .brand svg { width: 60px; height: 60px; }
      .brand span { font-size: 38px; font-weight: 600; letter-spacing: -0.02em; }
      h1 {
        margin-top: 64px;
        font-size: 92px; line-height: 1.02; font-weight: 600; letter-spacing: -0.035em;
        max-width: 900px;
      }
      h1 em {
        font-style: normal;
        background: linear-gradient(100deg, var(--accent) 0%, #ff8098 55%, var(--fg) 115%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      p {
        margin-top: 30px; font-size: 30px; line-height: 1.3; color: var(--muted); white-space: nowrap;
      }
      .domain {
        position: absolute; left: 80px; bottom: 60px;
        font-family: "Geist Mono Variable", monospace; font-size: 26px; color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="dots"></div>

    <!-- A balance line drifting down to the day the cash runs out, echoing the logo mark. -->
    <svg class="chart" width="420" height="225" viewBox="0 0 560 300" fill="none">
      <defs>
        <linearGradient id="fade" x1="0" x2="1">
          <stop offset="0" stop-color="#ff4d6d" stop-opacity="0" />
          <stop offset=".45" stop-color="#ff4d6d" stop-opacity=".9" />
          <stop offset="1" stop-color="#ff4d6d" />
        </linearGradient>
      </defs>
      <path d="M40 232h470" stroke="#f4f6f9" stroke-opacity=".22" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round" />
      <path d="M0 40 L110 92 L190 70 L280 128 L350 112 L430 190 L478 232"
        stroke="url(#fade)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="478" cy="232" r="13" fill="#ff4d6d" />
      <circle cx="478" cy="232" r="26" fill="#ff4d6d" fill-opacity=".18" />
    </svg>

    <div class="content">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="7" fill="#12151c" />
          <path d="M6 24.5h20" stroke="#f4f6f9" stroke-opacity=".4" stroke-width="2" stroke-linecap="round" />
          <path d="M6 8.5l6 4.5 4-1.5 7.5 13" fill="none" stroke="#ff4d6d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="23.5" cy="24.5" r="2.75" fill="#ff4d6d" />
        </svg>
        <span>Runway</span>
      </div>
      <h1>Know when your <em>cash runs out</em>.</h1>
      <p>Day-by-day cash-flow forecasts, private in your browser.</p>
    </div>
    <div class="domain">runway.danelrahmani.com</div>
  </body>
</html>
